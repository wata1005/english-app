<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>えいご あそびランド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Kiwi+Maru:wght@400;500&display=swap">
<style>
/* Layout: one-screen playroom — sticky top bar, chunky toy-block tiles on dotted sky paper, every target thumb-sized */
:root {
  --sky: #E4F2FB;
  --dot: #CFE3F1;
  --card: #FFFFFF;
  --ink: #22304F;
  --ink-soft: #5B6A88;
  --line: #C9DCEB;
  --lift: #B9D2E6;
  --sun: #FFC83D;
  --tomato: #FF6F59;
  --leaf: #3CC48A;
  --berry: #A08BFF;
  --ocean: #4AB3EE;
  --good-soft: #D5F5E6;
  --on-accent: #1B2440;
  --field-top: #AEDDFB;
  --sun-soft: #FFF1C2;
  --field-bot: #EEF8FF;
  --font: "Fredoka", "Kiwi Maru", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", "Yu Gothic", system-ui, sans-serif;
  --font-ja: "Kiwi Maru", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #132039; --dot: #1C2C4C; --card: #1F2F51; --ink: #EEF4FF; --ink-soft: #A9B8D6;
    --line: #34497A; --lift: #0A1326; --good-soft: #1D4A3C;
    --field-top: #1E3B6E; --field-bot: #142443; --sun-soft: #4A3D17; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #132039; --dot: #1C2C4C; --card: #1F2F51; --ink: #EEF4FF; --ink-soft: #A9B8D6;
  --line: #34497A; --lift: #0A1326; --good-soft: #1D4A3C;
    --field-top: #1E3B6E; --field-bot: #142443; --sun-soft: #4A3D17; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--sky);
  background-image: radial-gradient(var(--dot) 1.6px, transparent 1.8px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--font);
  font-size: 18px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible { outline: 4px solid var(--ocean); outline-offset: 3px; }
.ja { font-family: var(--font-ja); }

#app { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; min-height: 100%; display: flex; flex-direction: column; }
main { display: flex; flex-direction: column; gap: 24px; flex: 1; }

/* chunky toy-block surface */
.chunky {
  background: var(--card);
  border-radius: 24px;
  box-shadow: 0 6px 0 var(--lift);
  transition: transform .08s, box-shadow .08s;
}
.chunky:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--lift); }

/* top bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 12px;
  padding-block: 12px; background: var(--sky);
}
.brand { font-weight: 700; font-size: 1.3rem; letter-spacing: .02em; flex: 1; }
.brand b { color: var(--tomato); }
.bar-title { flex: 1; min-width: 0; text-align: center; font-weight: 600; font-size: 1.15rem; font-family: var(--font-ja); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-btn { width: 56px; height: 56px; font-size: 1.6rem; display: grid; place-items: center; }
.stars { display: flex; align-items: center; gap: 6px; height: 56px; padding-inline: 16px; font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stars.bump { animation: pop .45s; }
.bar .stars + .stars { padding-inline: 14px; }

/* home */
.hello { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; }
.hello-main { flex: 1 1 240px; min-width: 0; }
.home-pet { display: flex; align-items: center; gap: 8px; padding: 8px 18px 8px 10px; border-radius: 22px; background: var(--sky); box-shadow: inset 0 0 0 2px var(--line); }
.home-pet .hp-e { width: 64px; animation: bob 2.4s ease-in-out infinite; }
.home-pet .hp-b { font-family: var(--font-ja); font-size: .95rem; text-align: left; line-height: 1.35; }
.home-pet .hp-b small { color: var(--ink-soft); font-size: .8rem; }
.hello-en { font-size: 2.6rem; font-weight: 700; margin: 0; line-height: 1.1; color: var(--tomato); }
.hello-ja { margin: 4px 0 0; font-size: 1.1rem; }
.next { max-width: 360px; margin-top: 12px; }
.next p { margin: 8px 0 0; font-size: .95rem; color: var(--ink-soft); font-family: var(--font-ja); }
.next b { color: var(--ink); font-family: var(--font); font-size: 1.2rem; }
.meter { height: 18px; border-radius: 99px; background: var(--sky); box-shadow: inset 0 0 0 2px var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--sun); border-radius: 99px; min-width: 18px; }

.modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
@media (min-width: 640px) { .modes { grid-template-columns: repeat(3, 1fr); } }
.mode {
  background: var(--c); color: var(--on-accent);
  display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-end; gap: 2px;
  padding: 18px 20px; min-height: 160px; text-align: left; position: relative; overflow: hidden;
}
.mode .ico { font-size: 3.2rem; line-height: 1; margin-bottom: auto; }
.mode .m-ja { font-family: var(--font-ja); font-weight: 500; font-size: 1.25rem; }
.mode .m-en { font-size: .95rem; font-weight: 600; opacity: .7; letter-spacing: .04em; }
.sec { margin: 4px 0 -8px; font-family: var(--font-ja); font-weight: 500; font-size: 1.1rem; color: var(--ink-soft); display: flex; gap: 10px; align-items: baseline; }
.sec .en { font-size: .9rem; font-weight: 600; letter-spacing: .06em; }
@media (min-width: 640px) { .modes-sub { grid-template-columns: repeat(4, 1fr); } }
.mode .new { position: absolute; top: 14px; right: 14px; background: var(--card); color: var(--tomato); font-size: .8rem; font-weight: 700; letter-spacing: .08em; padding: 2px 10px; border-radius: 99px; }
.link { align-self: center; color: var(--ink-soft); font-family: var(--font-ja); font-size: .95rem; text-decoration: underline; text-underline-offset: 4px; padding: 12px; }

/* headings */
.ask { margin: 8px 0 0; text-align: center; font-family: var(--font-ja); font-weight: 500; font-size: 1.4rem; text-wrap: balance; }

/* category picker */
.cats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
@media (min-width: 640px) { .cats { grid-template-columns: repeat(3, 1fr); } }
.cat { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 20px 12px 16px; }
.cat .ico { font-size: 3.2rem; line-height: 1.1; }
.cat .c-ja { font-family: var(--font-ja); font-weight: 500; font-size: 1.2rem; }
.cat .c-en { font-weight: 600; color: var(--ink-soft); font-size: .95rem; }
.cat .c-seen { font-size: .8rem; color: var(--ink-soft); font-family: var(--font-ja); font-variant-numeric: tabular-nums; }

/* pictures */
.emoji { line-height: 1; display: block; }
.swatch { display: block; width: 1em; height: 1em; border-radius: 50%; background: var(--sw); box-shadow: inset 0 0 0 .05em rgba(0,0,0,.12), 0 0 0 .04em var(--line); }
.numpic { display: flex; flex-direction: column; align-items: center; gap: .08em; }
.digit { font-size: .55em; font-weight: 700; line-height: 1; color: var(--tomato); }
.dots { display: grid; grid-template-columns: repeat(5, .2em); gap: .05em; justify-content: center; }
.dots i { width: .2em; height: .2em; border-radius: 50%; background: var(--ocean); display: block; }

/* word cards */
.card-stage { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.bigcard { width: min(100%, 440px); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 32px 20px 28px; }
.bigcard .pic { font-size: 8rem; min-height: 1.1em; display: grid; place-items: center; }
.word { font-size: 3.4rem; font-weight: 600; line-height: 1.1; letter-spacing: .02em; overflow-wrap: anywhere; text-align: center; }
.word em, .abc-word em { font-style: normal; color: var(--tomato); }
.ja-word { font-family: var(--font-ja); font-size: 1.3rem; color: var(--ink-soft); }
.card-ctrl { display: flex; gap: 20px; align-items: center; }
.round { width: 72px; height: 72px; border-radius: 50%; font-size: 1.8rem; display: grid; place-items: center; }
.round.speak { width: 88px; height: 88px; background: var(--ocean); color: var(--on-accent); font-size: 2.2rem; }
.count { margin: 0; color: var(--ink-soft); font-weight: 600; font-variant-numeric: tabular-nums; }

.pill { padding: 16px 28px; border-radius: 99px; background: var(--sun); color: var(--on-accent); font-family: var(--font-ja); font-weight: 500; font-size: 1.15rem; }
.pill.alt { background: var(--card); color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }

/* quiz */
.quiz, .spell { display: flex; flex-direction: column; align-items: center; gap: 24px; }
.progress { display: flex; gap: 8px; }
.progress i { width: 16px; height: 16px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); display: block; }
.progress i.done { background: var(--leaf); box-shadow: none; }
.progress i.now { background: var(--sun); box-shadow: none; transform: scale(1.25); }
.listen { display: flex; align-items: center; gap: 12px; padding: 14px 28px 14px 18px; border-radius: 99px; background: var(--ocean); color: var(--on-accent); font-family: var(--font-ja); font-weight: 500; font-size: 1.2rem; }
.listen .l-ico { font-size: 2rem; }
.opts { display: grid; gap: 16px; width: 100%; max-width: 620px; }
.opts.n3 { grid-template-columns: repeat(3, 1fr); }
.opts.n4 { grid-template-columns: repeat(2, 1fr); max-width: 480px; }
.opt { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; font-size: clamp(3.4rem, 14vw, 6rem); }
.opt.correct { background: var(--good-soft); box-shadow: 0 6px 0 var(--leaf), inset 0 0 0 5px var(--leaf); animation: pop .5s; }
.opt.wrong { animation: shake .45s; opacity: .35; }

/* ABC */
.abc { display: flex; flex-direction: column; gap: 20px; }
.abc-show { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 32px; padding: 24px; }
.abc-big { font-size: 5.5rem; font-weight: 700; line-height: 1; color: var(--tomato); }
.abc-big small { font-size: .6em; color: var(--ink); margin-left: .12em; }
.abc-pic { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.abc-pic .emoji { font-size: 5rem; }
.abc-word { font-size: 2rem; font-weight: 600; }
.abc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 10px; }
.abc-key { height: 60px; border-radius: 16px; font-size: 1.7rem; font-weight: 600; }
.abc-key.on { background: var(--sun); color: var(--on-accent); }

/* spelling */
.spell-top { display: flex; align-items: center; gap: 24px; }
.spell-top .pic { font-size: 7rem; }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.slots.shake { animation: shake .45s; }
.slot { width: 64px; height: 76px; border-radius: 16px; border: 3px dashed var(--line); background: var(--card); font-size: 2.4rem; font-weight: 600; display: grid; place-items: center; }
.slot.full { border-style: solid; border-color: var(--ocean); }
.slot.ok { border-color: var(--leaf); background: var(--good-soft); }
.ghost { color: var(--ink-soft); opacity: .35; }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; max-width: 520px; }
.tile { width: 68px; height: 68px; border-radius: 18px; background: var(--sun); color: var(--on-accent); font-size: 2.2rem; font-weight: 600; }
.tile:disabled { opacity: .2; box-shadow: none; transform: translateY(4px); cursor: default; }

/* result */
.result { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 36px 20px; text-align: center; }
.result .big { font-size: 3rem; font-weight: 700; color: var(--tomato); margin: 0; line-height: 1.1; }
.result .earned { font-size: 2.6rem; letter-spacing: .1em; overflow-wrap: anywhere; }
.result p { margin: 0; font-family: var(--font-ja); font-size: 1.2rem; }

/* stickers */
.stk-note { text-align: center; margin: 0; color: var(--ink-soft); font-family: var(--font-ja); }
.stickers { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 14px; }
.sticker { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: 2.8rem; }
.sticker.locked { background: transparent; box-shadow: none; border: 3px dashed var(--line); color: var(--ink-soft); font-size: 1.6rem; font-weight: 600; }

/* parent */
.panel { padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 12px; font-family: var(--font-ja); }
.panel h2 { margin: 0; font-size: 1.3rem; font-weight: 500; }
.panel h3 { margin: 8px 0 0; font-size: 1.05rem; font-weight: 500; }
.panel ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; font-size: .95rem; max-width: 65ch; }
.seg { display: flex; flex-wrap: wrap; gap: 10px; }
.seg button { padding: 12px 20px; border-radius: 14px; background: var(--sky); box-shadow: inset 0 0 0 2px var(--line); font-family: var(--font-ja); font-size: 1rem; }
.seg button[aria-pressed="true"] { background: var(--sun); color: var(--on-accent); box-shadow: none; }
.seg .danger { background: var(--tomato); color: var(--on-accent); box-shadow: none; }
.note { font-size: .9rem; color: var(--ink-soft); margin: 0; }

/* balloon game */
.bgame { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.bhud { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 20px; }
.field {
  position: relative; width: 100%; height: min(62vh, 540px); min-height: 380px; overflow: hidden;
  border-radius: 28px; background: linear-gradient(var(--field-top), var(--field-bot));
  box-shadow: inset 0 0 0 3px var(--line); touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.field::before, .field::after { content: '☁️'; position: absolute; font-size: 3.5rem; opacity: .7; pointer-events: none; }
.field::before { top: 8%; left: 8%; }
.field::after { top: 22%; right: 10%; font-size: 2.6rem; }
.balloon {
  position: absolute; left: 0; top: 0; z-index: 1;
  width: clamp(74px, 20vw, 100px); aspect-ratio: 5 / 6; max-width: 100%;
  border-radius: 50% 50% 47% 47% / 56% 56% 44% 44%; background: var(--bc);
  display: grid; place-items: center; font-size: clamp(2rem, 8vw, 2.7rem);
  box-shadow: inset -8px -10px 0 rgba(0,0,0,.12), inset 8px 8px 0 rgba(255,255,255,.35);
  will-change: transform; touch-action: none;
}
.balloon::after { content: ''; position: absolute; top: 100%; left: 50%; width: 2px; height: 34px; background: var(--ink-soft); opacity: .6; }
.balloon .emoji { width: 1.45em; height: 1.45em; border-radius: 50%; background: rgba(255,255,255,.8); display: grid; place-items: center; }
.balloon.wobble .emoji { animation: shake .45s; }
.balloon.popped { background: transparent; box-shadow: none; }
.balloon.popped::after { display: none; }
.balloon.popped .emoji { background: transparent; animation: pop .3s; }

/* pet */
.pet { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.pet-stage { width: min(100%, 440px); padding: 22px 20px 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.bubble { margin: 0; position: relative; background: var(--sky); padding: 8px 20px; border-radius: 18px; font-size: 1.15rem; box-shadow: inset 0 0 0 2px var(--line); }
.pet-body { display: block; width: min(230px, 62vw); animation: bob 2.4s ease-in-out infinite; }
.pet-body.happy { animation: hop .5s 2; }
.pet-body.wobble { animation: shake .5s; }
.pet-name { margin: 0; display: flex; gap: 14px; align-items: center; font-family: var(--font-ja); }
.hearts { font-family: var(--font); font-weight: 600; font-variant-numeric: tabular-nums; }
.pet-msg { margin: 0; text-align: center; font-family: var(--font-ja); font-size: 1.15rem; text-wrap: balance; }
.pet-msg b { font-family: var(--font); font-size: 1.4rem; color: var(--tomato); }
.growth { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.growth li { width: 66px; padding: 8px 0 6px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); display: flex; flex-direction: column; align-items: center; }
.growth li.now { background: var(--sun); color: var(--on-accent); box-shadow: none; }
.growth .g-e { width: 40px; font-size: 1.8rem; line-height: 1.2; }
.growth li:not(.got) .g-e { font-size: 1.3rem; font-weight: 600; color: var(--ink-soft); line-height: 1.66; text-align: center; }
.growth .g-at { font-size: .8rem; font-variant-numeric: tabular-nums; }
@keyframes bob { 50% { transform: translateY(-8px); } }
@keyframes hop { 50% { transform: translateY(-30px) scale(1.06); } }

/* mole game — a grass scene with fixed colors */
.mgame, .memgame, .sgame { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.sign { display: grid; place-items: center; min-width: 64px; height: 64px; padding-inline: 12px; border-radius: 16px; background: var(--card); box-shadow: 0 5px 0 var(--lift); font-size: 2.4rem; font-weight: 700; color: var(--tomato); }
.meadow { width: 100%; max-width: 520px; padding: 24px 18px 18px; border-radius: 28px; background: linear-gradient(#A8E07F, #6FBF57); box-shadow: inset 0 0 0 3px rgba(0,0,0,.08); }
.holes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 12px; }
.hole {
  position: relative; aspect-ratio: 1; max-width: 100%; overflow: hidden;
  border-bottom: 14px solid #8B5A2B; border-radius: 0 0 22px 22px;
  background: radial-gradient(ellipse 46% 22% at 50% 100%, #3A2614 0 98%, transparent 100%);
}
.mole {
  position: absolute; left: 50%; bottom: 0; width: 86%;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transform: translate(-50%, 110%); transition: transform .16s ease-out; touch-action: none;
}
.mole.up { transform: translate(-50%, 4%); }
.m-card { min-width: 1.7em; padding: 0 .35em; border-radius: 10px; background: #FFFFFF; color: #22304F; font-size: clamp(1.4rem, 6vw, 2rem); font-weight: 700; line-height: 1.3; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.m-face { font-size: clamp(2.4rem, 11vw, 3.4rem); line-height: 1; }
.mole.miss .m-card { animation: shake .4s; }

/* memory cards */
.mcards { width: 100%; max-width: 520px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.mcard { aspect-ratio: 3 / 4; max-width: 100%; perspective: 600px; }
.mc-in { position: relative; display: block; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
.mcard.up .mc-in { transform: rotateY(180deg); }
.mc-back, .mc-front { position: absolute; inset: 0; border-radius: 16px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 5px 0 var(--lift); }
.mc-back { background-color: var(--berry); background-image: radial-gradient(rgba(255,255,255,.3) 2px, transparent 2.5px); background-size: 14px 14px; color: var(--on-accent); font-size: 2rem; font-weight: 700; }
.mc-front { background: var(--card); transform: rotateY(180deg); font-size: clamp(2rem, 9vw, 3rem); }
.mc-word { font-size: clamp(.95rem, 4.2vw, 1.35rem); font-weight: 600; padding: 0 4px; text-align: center; overflow-wrap: anywhere; line-height: 1.15; }
.mcard.done .mc-front { background: var(--good-soft); box-shadow: 0 5px 0 var(--leaf); }

/* shop game */
.counter { width: min(100%, 480px); display: flex; align-items: center; gap: 16px; padding: 18px 20px; }
.who { font-size: 4.6rem; line-height: 1; }
.who.happy { animation: hop .5s 2; }
.say-order { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; font-family: var(--font-ja); }
.order-hint { font-family: var(--font); font-size: 1.5rem; font-weight: 600; }
.basket { width: min(100%, 480px); min-height: 84px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 12px 16px; }
.basket .b-ico { font-size: 2.2rem; margin-right: 6px; }
.b-item { font-size: 2.4rem; line-height: 1; padding: 2px; }

/* captions: the English line, its katakana reading and meaning */
.caption { width: min(100%, 480px); padding: 10px 16px; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); display: flex; flex-direction: column; gap: 2px; text-align: center; }
.caption p { margin: 0; }
.cap-en { font-size: 1.4rem; font-weight: 600; line-height: 1.3; }
.cap-en b { color: var(--tomato); font-weight: 600; }
.cap-kana { font-family: var(--font-ja); font-size: .95rem; color: var(--ink-soft); }
.cap-ja { font-family: var(--font-ja); font-size: .95rem; }
.cap-kana b, .cap-ja b { font-weight: 500; color: var(--ink); }
.mask { display: inline-block; min-width: 2.2em; border-bottom: 3px solid var(--sun); color: var(--ink-soft); line-height: 1.1; }
.mcap { width: 100%; display: flex; justify-content: center; min-height: 1px; }

const ABC = [

].map(([w, e], i) => { const u = String.fromCharCode(65 + i); return { u, l: u.toLowerCase(), w, e }; });

const STICKERS = ['🦄','🐳','🦖','🌈','🍩','🚒','🐙','🌻','🦋','🍉','🐧','⚽','🎈','🐞','🍭','🦒','🚁','🐬','🌟','👑'];

const EXTRA = ['Try again!', 'Perfect! Great job!', 'Good job!', "Hello! Let's play!", 'Oops! Try again!',
  'Hello!', 'I love you!', 'Yummy! Thank you!', 'No, thank you.', "I'm full! See you tomorrow!", 'Thank you!', 'You look great!',

const abcLine = L => `${L.u} is for ${L.w}.`;

// ふうせんわり: 絵で見分けられる ことば
const BALLOON_WORDS = ['animals', 'food', 'vehicles', 'body'].flatMap(id => CAT[id].words);
const popLine = w => `Pop the ${w.en}!`;
// ペット: ⭐の数で そだつ
const PET_STAGES = [
  { at: 0, e: '🥚', ja: 'たまご' }, { at: 5, e: '🐣', ja: 'うまれたて' }, { at: 15, e: '🐥', ja: 'ひよこ' },

];
const wantLine = w => `I want ${w.art || 'a'} ${w.en}!`;
// きせかえ: コインで かう。名前は英語で読み上げる
const SLOTS = [{ id: 'head', ja: 'あたま' }, { id: 'face', ja: 'かお' }, { id: 'hand', ja: 'もちもの' }, { id: 'bg', ja: 'ばしょ' }];
const ITEMS = [
  { id: 'cap', slot: 'head', e: '🧢', en: 'cap', ja: 'ぼうし', price: 5 },
  { id: 'ribbon', slot: 'head', e: '🎀', en: 'ribbon', ja: 'リボン', price: 8 },
  { id: 'flower', slot: 'head', e: '🌸', en: 'flower', ja: 'おはな', price: 8 },
  { id: 'hat', slot: 'head', e: '🎩', en: 'hat', ja: 'シルクハット', price: 15 },
  { id: 'crown', slot: 'head', e: '👑', en: 'crown', ja: 'おうかん', price: 30 },

  { id: 'sunglasses', slot: 'face', e: '🕶️', en: 'sunglasses', ja: 'サングラス', price: 18 },
  { id: 'balloon', slot: 'hand', e: '🎈', en: 'balloon', ja: 'ふうせん', price: 5 },
  { id: 'lollipop', slot: 'hand', e: '🍭', en: 'lollipop', ja: 'ペロペロキャンディ', price: 8 },
  { id: 'umbrella', slot: 'hand', e: '☂️', en: 'umbrella', ja: 'かさ', price: 12 },
  { id: 'wand', slot: 'hand', e: '🪄', en: 'magic wand', ja: 'まほうの つえ', price: 20 },
  { id: 'trophy', slot: 'hand', e: '🏆', en: 'trophy', ja: 'トロフィー', price: 40 },
  { id: 'park', slot: 'bg', e: '🌳', en: 'park', ja: 'こうえん', price: 10, d: ['🌳', '🌷'] },
  { id: 'beach', slot: 'bg', e: '🏖️', en: 'beach', ja: 'うみ', price: 15, d: ['⛱️', '🐚'] },
  { id: 'snow', slot: 'bg', e: '⛄', en: 'snow', ja: 'ゆき', price: 20, d: ['⛄', '❄️'] },
  { id: 'space', slot: 'bg', e: '🪐', en: 'space', ja: 'うちゅう', price: 25, d: ['🪐', '✨'] },
  { id: 'castle', slot: 'bg', e: '🏰', en: 'castle', ja: 'おしろ', price: 30, d: ['🏰', '🌈'] },
];
const ITEM = Object.fromEntries(ITEMS.map(it => [it.id, it]));
// おみせやさん: かずと たべものを くみあわせた ちゅうもん
const SHOP_FOODS = [['apple', 'apples'], ['banana', 'bananas'], ['strawberry', 'strawberries'], ['orange', 'oranges'], ['carrot', 'carrots'], ['egg', 'eggs']]
  .map(([one, many]) => ({ ...CAT.food.words.find(w => w.en === one), many }));
const NUMS = ['One', 'Two', 'Three', 'Four', 'Five'];
const orderLine = (n, w) => `${NUMS[n - 1]} ${n === 1 ? w.en : w.many}, please!`;
// もぐらたたき(しょうがくせい): まちがえやすい 文字を まぜる
const CONFUSE = { b: 'dpq', d: 'bpq', p: 'bdq', q: 'bdp', m: 'nw', n: 'mhu', u: 'nv', v: 'uwy', w: 'vm', i: 'jl', j: 'ig', l: 'it', h: 'nk', c: 'eo', e: 'ca', o: 'ac', g: 'qj', t: 'fl', f: 't', y: 'v' };

const clipKey = t => t[0] === '#' ? 'L_' + t[1] : t.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
// アプリが読み上げるすべてのフレーズ(tools/build.js が音声を作る)
function phrases() {
  const out = new Set();
  CATS.forEach(c => c.words.forEach(w => { out.add(w.en); out.add(c.q(w)); }));
  ABC.forEach(L => { out.add(L.w); out.add(abcLine(L)); });

const CLIPS = {/*CLIPS*/};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);

/* ---------- storage ---------- */
const KEY = 'eigo-asobi-v1';

/* ---------- speech ---------- */
// 録音ずみの音声(CLIPS)を Web Audio で再生する。ない言葉だけ端末の読み上げにまかせる
const Speech = {
  ok: true, tts: 'speechSynthesis' in window, voice: null, seq: 0, src: null, buffers: {},
  init() {
    if (!this.tts) return;
    const pickVoice = () => {
      const vs = speechSynthesis.getVoices();
      this.voice = vs.find(v => /^en[-_]US/i.test(v.lang) && /Samantha|Google US|Aria|Jenny|Ava|Allison/i.test(v.name))
        || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
    };
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  },
  buffer(k) {
    if (!this.buffers[k]) {
      const bin = atob(CLIPS[k]), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      this.buffers[k] = new Promise((res, rej) => ac.decodeAudioData(bytes.buffer, res, rej));
    }
    return this.buffers[k];
  },
  async clip(k, slow) { return this.playBuf(await this.buffer(k), state.rate / 0.8 * (slow ? .75 : 1)); },
  playBuf(buf, rate = 1) {
    return new Promise(res => {
      const s = ac.createBufferSource();
      s.buffer = buf; s.playbackRate.value = rate;
      s.connect(ac.destination); s.onended = res;
      this.src = s; s.start();
    });
  },
  tts1(text, slow) {
    if (!this.tts) return Promise.resolve();
    return new Promise(res => {
      const u = new SpeechSynthesisUtterance(text[0] === '#' ? text[1] : text);
      u.lang = 'en-US'; if (this.voice) u.voice = this.voice;
      u.rate = state.rate * (slow ? .75 : 1); u.pitch = 1.1;
      u.onend = res; u.onerror = res;
      speechSynthesis.resume();
      speechSynthesis.speak(u);
      setTimeout(res, 5000);
    });
  },
  async one(text, slow) {
    const k = clipKey(text);
    if (CLIPS[k] && sfx.ctx()) {
      try { return await this.clip(k, slow); } catch (e) { delete CLIPS[k]; }
    }
    return this.tts1(text, slow);
  },
  stop() {
    if (this.src) { try { this.src.onended = null; this.src.stop(); } catch (e) {} this.src = null; }
    if (this.tts && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel();
  },
  sayAll(list, slow) {
    const id = ++this.seq;
    this.stop();
    return list.reduce((p, t) => p.then(() => id === this.seq ? this.one(t, slow) : null), Promise.resolve());
  },
  say(t, slow) { return this.sayAll([t], slow); }
};
Speech.init();

let ac;
const sfx = {
  ctx() {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
    if (ac.state === 'suspended') ac.resume();
    if (!this.unlocked) { // iOS: 最初のタップで無音を鳴らして音を解放する
      const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(); this.unlocked = true;
    }
    return ac;
  },
  play(notes, type) {
    const c = this.ctx(); if (!c) return;

  return `<div class="caption" aria-live="polite"><p class="cap-en">${fill(line.en, 'en')}</p>${state.caption === 'full'
    ? `<p class="cap-kana">${fill(line.kana, 'kana')}</p><p class="cap-ja">${fill(line.ja, 'ja')}</p>` : ''}</div>`;
}
// こたえた あと(または つぎの もんだい)に 字幕を かきかえる
function setCaption(line, hide) { const c = $('.caption'); if (c) c.outerHTML = caption(line, hide); }

// ヒント: 1かいめ=にほんごの いみ + ゆっくり よみあげ、2かいめ=こたえが ひかる(⭐は なし)
function hintRow(v) {
  const max = v.name === 'speak' ? 1 : 2, lv = v.hintLv || 0;
  return `<div class="hintrow"><button class="hint-btn" data-act="hint" ${lv >= max ? 'disabled' : ''}>💡 ${
    v.name === 'memory' ? 'ちらっと みる' : lv && lv < max ? 'もっと ヒント' : 'ヒント'}</button>${v.hintText ? `<p class="hint-box">${v.hintText}</p>` : ''}</div>`;
}
function nudgeHint() { const b = $('.hint-btn'); if (b && state.level === 1 && !b.disabled) { b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); } }
const progress = (n, i) => `<div class="progress" aria-label="${i + 1} / ${n}">${Array.from({ length: n }, (_, k) => `<i class="${k < i ? 'done' : k === i ? 'now' : ''}"></i>`).join('')}</div>`;

/* ---------- views ---------- */
const app = $('#app');
let view = { name: 'home' };
const TITLES = { speak: 'おしゃべり', mole: 'もぐらたたき', memory: 'しんけいすいじゃく', shopgame: 'おみせやさん', closet: 'きせかえ', balloon: 'ふうせんわり', pet: 'ペット', pick: 'どれに する?', cards: 'ことば カード', quiz: 'きいて タッチ', abc: 'ABC', spell: 'もじ ならべ', result: 'できたね!', stickers: 'シール ちょう', parent: 'おうちの かたへ' };

function go(name, params = {}) { view = { name, ...params }; render(); window.scrollTo(0, 0); }

function render() {
  const home = view.name === 'home';
  app.innerHTML = `
    <header class="bar">
      ${home ? `<span class="brand">えいご<b>あそび</b>ランド</span>` : `<button class="bar-btn chunky" data-act="home" aria-label="ホームへ もどる">🏠</button><span class="bar-title">${TITLES[view.name] || ''}</span>`}
      <button class="stars chunky" data-act="go" data-arg="stickers" aria-label="あつめた ほし ${state.stars}こ"><span aria-hidden="true">⭐</span><b id="starCount">${state.stars}</b></button>
      <button class="stars chunky" data-act="closet" aria-label="コイン ${state.coins}まい。きせかえへ"><span aria-hidden="true">🪙</span><b>${state.coins}</b></button>
    </header>
    <main>${VIEWS[view.name]()}</main>`;
}

const VIEWS = {
  home() {
    const left = 5 - state.stars % 5;
    const allDone = Math.floor(state.stars / 5) >= STICKERS.length;
    const pet = PET_STAGES[petStage()];
    const tile = (mode, ja, en, ico, c, isNew) =>
      `<button class="mode chunky" style="--c:var(${c})" data-act="mode" data-arg="${mode}"><span class="ico" aria-hidden="true">${ico}</span>${isNew ? '<span class="new">NEW</span>' : ''}<span><span class="m-ja">${ja}</span><br><span class="m-en">${en}</span></span></button>`;
    return `
      <section class="hello chunky">
        <div class="hello-main">
          <p class="hello-en">Hello!</p><p class="hello-ja ja">きょうも えいごで あそぼう</p>
          <div class="next">
            <div class="meter"><i style="width:${(state.stars % 5) / 5 * 100}%"></i></div>
            <p>${allDone ? 'シールを ぜんぶ あつめたよ!すごい!' : `あと <b>${left}</b>こ ⭐ で シールが もらえるよ`}</p>
          </div>
        </div>
        <button class="home-pet" data-act="pet" aria-label="ペットに あいに いく">
          <span class="hp-e" aria-hidden="true">${figure()}</span>
          <span class="hp-b">${petStage() === 0 ? 'あたためてね' : mealsLeft() ? 'おなか すいた〜' : 'げんき いっぱい!'}<br><small>${pet.ja}</small></span>
        </button>
      </section>
      <h2 class="sec">ゲーム <span class="en">Games</span></h2>
      <nav class="modes" aria-label="ゲームを えらぶ">
        ${tile('quiz', 'きいて タッチ', 'Listen & Touch', '👂', '--ocean')}
        ${tile('balloon', 'ふうせんわり', 'Balloon Pop', '🎈', '--tomato')}
        ${tile('speak', 'おしゃべり', 'Say It!', '🎤', '--berry', true)}
        ${tile('mole', 'もぐらたたき', 'Whack-a-Letter', '🐹', '--leaf')}
        ${tile('memory', 'しんけいすいじゃく', 'Memory', '🎴', '--sun')}
        ${tile('shopgame', 'おみせやさん', 'Shop', '🧺', '--ocean')}
      </nav>
      <h2 class="sec">まなぶ・あつめる <span class="en">Learn</span></h2>
      <nav class="modes modes-sub" aria-label="まなぶ">
        ${tile('cards', 'ことば カード', 'Word Cards', '🃏', '--sun')}
        ${tile('abc', 'エー ビー シー', 'ABC', '🔤', '--leaf')}
        ${tile('spell', 'もじ ならべ', 'Spelling', '🧩', '--tomato')}
        ${tile('stickers', 'シール ちょう', 'Sticker Book', '🦄', '--berry')}
      </nav>
      <button class="link" data-act="go" data-arg="parent">おうちの かたへ ・ せってい</button>`;
  },

  pick() {
    return `<h2 class="ask">${view.next === 'cards' ? 'どの ことばを みる?' : 'どれで クイズ する?'}</h2>
      <div class="cats">${CATS.map(c => {
        const seen = c.words.filter(w => state.learned[c.id + ':' + w.en]).length;
        return `<button class="cat chunky" data-act="cat" data-arg="${c.id}">
          <span class="ico" aria-hidden="true">${c.icon}</span><span class="c-ja">${c.ja}</span><span class="c-en">${c.en}</span>
          <span class="c-seen">みた ことば ${seen} / ${c.words.length}</span></button>`;
      }).join('')}</div>`;
  },

  cards() {
    const c = CAT[view.cat], w = c.words[view.i], last = view.i === c.words.length - 1;
    return `<div class="card-stage">
      <button class="bigcard chunky" data-act="say" aria-label="${w.en} を きく">
        <span class="pic">${pic(w, true)}</span>
        <span class="word">${hl(w.en, w.en[0])}</span>
        ${state.caption === 'full' ? `<span class="kana-word">${KANA[w.en] || ''}</span>` : ''}
        ${state.showJa ? `<span class="ja-word">${w.ja}</span>` : ''}
      </button>
      <div class="card-ctrl">
        <button class="round chunky" data-act="step" data-arg="-1" aria-label="まえの カード">◀</button>
        <button class="round speak chunky" data-act="say" aria-label="もういちど きく">🔊</button>
        <button class="round chunky" data-act="step" data-arg="1" aria-label="つぎの カード">▶</button>
      </div>
      <p class="count">${view.i + 1} / ${c.words.length}</p>
      ${last ? `<button class="pill chunky" data-act="quizFromCards">この ことばで クイズ!</button>` : ''}
    </div>`;
  },

  quiz() {
    const q = view.round[view.i];
    return `<div class="quiz">
      ${progress(view.round.length, view.i)}
      <button class="listen chunky" data-act="qsay"><span class="l-ico" aria-hidden="true">🔊</span>きいて、タッチ!</button>
      ${caption(lineQ(CAT[view.cat], q.answer), state.capHide)}
      <div class="opts n${q.options.length}">${q.options.map((w, k) =>
        `<button class="opt chunky" data-act="pick" data-arg="${k}" aria-label="${w.ja}">${pic(w)}</button>`).join('')}</div>
      ${hintRow(view)}
    </div>`;
  },

  abc() {
    const L = ABC[view.sel];
    return `<div class="abc">
      <button class="abc-show chunky" data-act="abcsay" aria-label="${L.u} を きく">
        <span class="abc-big">${L.u}<small>${L.l}</small></span>

      </button>
      ${caption(lineABC(L), false)}
      <div class="abc-grid">${ABC.map((x, k) =>
        `<button class="abc-key chunky ${k === view.sel ? 'on' : ''}" data-act="abc" data-arg="${k}" aria-pressed="${k === view.sel}">${x.u}</button>`).join('')}</div>
    </div>`;
  },

  spell() {
    const v = view, w = v.words[v.i], ans = w.en;
    const glowAt = v.hintLv >= 2 && !v.done ? v.tiles.findIndex(t => !t.used && t.ch === ans[v.filled.length]) : -1;
    return `<div class="spell">
      ${progress(v.words.length, v.i)}
      <div class="spell-top"><span class="pic">${pic(w, true)}</span>
        <button class="round speak chunky" data-act="ssay" aria-label="ことばを きく">🔊</button></div>
      <div class="slots ${v.shake ? 'shake' : ''}">${[...ans].map((ch, j) => {
        const t = v.filled[j];
        return `<button class="slot ${t != null ? 'full' : ''} ${v.done ? 'ok' : ''}" data-act="unslot" data-arg="${j}" ${t == null || v.done ? 'disabled' : ''} aria-label="${j + 1}もじめ">${
          t != null ? v.tiles[t].ch : (state.level === 1 ? `<span class="ghost">${ch}</span>` : '')}</button>`;
      }).join('')}</div>
      ${v.done ? caption(lineWord(w), false) : ''}
      <div class="tiles">${v.tiles.map((t, k) =>
        `<button class="tile chunky ${k === glowAt ? 'glow' : ''}" data-act="tile" data-arg="${k}" ${t.used || v.done ? 'disabled' : ''}>${t.ch}</button>`).join('')}</div>
      <div class="row">${v.done
        ? `<button class="pill chunky" data-act="snext">つぎへ ▶</button>`
        : `<button class="pill alt chunky" data-act="sback" ${v.filled.length ? '' : 'disabled'}>⌫ ひとつ けす</button>`}</div>
      ${v.done ? '' : hintRow(v)}
    </div>`;
  },

  result() {
    const v = view;
    return `<section class="result chunky">
      <p class="big">${v.perfect ? 'Perfect!' : 'Good job!'}</p>
      <div class="earned" aria-label="ほし ${v.earned}こ">${'⭐'.repeat(v.earned)}</div>
      <p>${v.perfect ? 'ぜんぶ せいかい!すごいね!' : 'よく がんばったね!'}</p>
      <p>ほしを <b>${v.earned}</b>こ もらったよ</p>
      <p class="coin-line">🪙 +${v.coins} <span class="ja">コイン</span></p>
      <div class="row">
        <button class="pill chunky" data-act="again">もういちど</button>
        <button class="pill alt chunky" data-act="home">おしまい</button>
      </div>
    </section>`;
  },

  balloon() {
    return `<div class="bgame">
      <div class="bhud">
        ${progress(view.total, view.i)}
        <button class="listen chunky" data-act="bsay"><span class="l-ico" aria-hidden="true">🔊</span>きいて、わろう!</button>
      </div>
      ${caption(linePop(view.words[view.i]), state.capHide)}
      ${hintRow(view)}
      <div class="field" aria-label="ふうせん"></div>
    </div>`;
  },

  mole() {
    const v = view, L = v.words[v.i];
    return `<div class="mgame">
      ${progress(v.total, v.i)}
      <div class="bhud">
        <button class="listen chunky" data-act="msay"><span class="l-ico" aria-hidden="true">🔊</span>きいて、たたこう!</button>
        ${state.level === 1 ? `<span class="sign" aria-label="さがす もじ">${L.u}</span>` : ''}
      </div>
      ${caption(lineLetter(L), state.capHide)}
      ${hintRow(v)}
      <div class="meadow"><div class="holes">${Array.from({ length: 9 }, (_, k) =>
        `<div class="hole"><button class="mole" data-act="whack" data-arg="${k}" tabindex="-1"><span class="m-card"></span><span class="m-face">🐹</span></button></div>`).join('')}</div></div>
    </div>`;
  },

  memory() {
    const v = view;
    return `<div class="memgame">
      <p class="ask">おなじ ことばを 2まい さがそう</p>
      <div class="mcards">${v.cards.map((c, k) =>
        `<button class="mcard" data-act="flip" data-arg="${k}" aria-label="カード ${k + 1}"><span class="mc-in"><span class="mc-back" aria-hidden="true">?</span><span class="mc-front">${
          c.face === 'pic' ? `<span class="emoji">${c.w.e}</span>` : `<span class="mc-word">${c.w.en}</span>`}</span></span></button>`).join('')}</div>
      <div class="mcap">${v.last ? caption(lineWord(v.last), false) : ''}</div>
      <p class="count mcount">みつけた ${v.matched} / ${v.total}</p>
      ${hintRow(v)}
    </div>`;
  },

  shopgame() {
    const v = view, o = v.words[v.i];
    return `<div class="sgame">
      ${progress(v.total, v.i)}
      <div class="counter chunky">
        <span class="who ${v.done ? 'happy' : ''}" aria-hidden="true">${o.who}</span>
        <button class="bubble say-order" data-act="osay"><span aria-hidden="true">🔊</span>${
          v.done ? 'ありがとう!' : 'なにが ほしいかな?'}</button>
      </div>
      ${caption(lineOrder(o.n, o.w), state.capHide && !v.done)}
      <div class="basket chunky" aria-label="かご"><span class="b-ico" aria-hidden="true">🧺</span>${
        v.basket.length ? v.basket.map((w, k) => `<button class="b-item" data-act="unbasket" data-arg="${k}" aria-label="${w.ja}を もどす" ${v.done ? 'disabled' : ''}>${w.e}</button>`).join('')
                        : '<span class="hint">たなから えらんで いれてね</span>'}</div>
      <div class="opts n${v.shelf.length}">${v.shelf.map((w, k) =>
        `<button class="opt chunky" data-act="tobasket" data-arg="${k}" aria-label="${w.ja}" ${v.done ? 'disabled' : ''}>${pic(w)}</button>`).join('')}</div>
      <div class="row">${v.done
        ? `<button class="pill chunky" data-act="onext">つぎの おきゃくさん ▶</button>`
        : `<button class="pill chunky" data-act="handover" ${v.basket.length ? '' : 'disabled'}>はい、どうぞ!</button>`}</div>
      ${v.done ? '' : hintRow(v)}
    </div>`;
  },

  speak() {
    const v = view, w = v.words[v.i];
    const STATUS = {
      ready: v.mode === 'repeat' ? 'おてほんを きいて、こえに だして いってみよう' : 'おてほんを きいたら 🎤を おして いってみよう',
      rec: v.mode === 'auto' ? 'きいてるよ… いってみて!' : 'ろくおん ちゅう… いいおわったら ⏹ を おしてね',
      check: v.mode === 'auto' ? (v.heard ? `「<b>${v.heard}</b>」って きこえたよ。もういちど いってみよう` : 'きこえなかったよ。もういちど いってみよう')
        : v.mode === 'record' ? 'じぶんの こえと おてほん、にてるかな?' : 'いえたかな?',
      ok: v.heard ? `「<b>${v.heard}</b>」って きこえたよ。じょうず!` : 'じょうずに いえたね!'
    };
    const judge = `<div class="row"><button class="pill chunky" data-act="spOk">いえた! ⭐</button>${v.mode === 'repeat' ? '<button class="pill alt chunky" data-act="spRetry">もういちど</button>' : ''}</div>`;
    let ctrl;
    if (v.phase === 'ok') ctrl = `<button class="pill chunky" data-act="spNext">つぎへ ▶</button>`;
    else if (v.mode === 'repeat') ctrl = v.phase === 'check' ? judge : `<button class="pill chunky" data-act="spMic">✋ いってみたよ</button>`;
    else ctrl = `<button class="mic chunky ${v.phase === 'rec' ? 'on' : ''}" data-act="spMic" aria-label="${v.phase === 'rec' ? 'とめる' : 'マイクで いう'}">${v.phase === 'rec' ? '⏹' : '🎤'}</button>`
      + (v.phase === 'check' && (v.mode === 'record' || v.tries >= 2) ? judge : '');
    return `<div class="speak">
      ${progress(v.total, v.i)}
      <div class="say-card chunky">
        <span class="pic">${pic(w, true)}</span>
        <span class="word">${hl(w.en, w.en[0])}</span>
        ${state.caption === 'full' ? `<span class="kana-word">${KANA[w.en] || ''}</span>` : ''}
        ${state.showJa ? `<span class="ja-word">${w.ja}</span>` : ''}
      </div>
      <div class="row">
        <button class="listen chunky" data-act="spModel"><span class="l-ico" aria-hidden="true">🔊</span>おてほん</button>
        ${v.buf ? `<button class="listen mine chunky" data-act="spMine"><span class="l-ico" aria-hidden="true">🔁</span>じぶんの こえ</button>` : ''}
      </div>
      <p class="sp-status">${v.note ? v.note + '<br>' : ''}${STATUS[v.phase]}</p>
      ${ctrl}
      ${v.phase === 'ok' ? '' : hintRow(v)}
    </div>`;
  },

  pet() {
    const v = view, st = petStage(), P = PET_STAGES[st], next = PET_STAGES[st + 1], left = mealsLeft();
    let bubble, body;
    if (st === 0) {
      bubble = 'zzz…';
      body = `<p class="pet-msg">⭐を あと <b>${next.at - state.stars}</b>こ あつめると うまれるよ</p>
        <button class="pill chunky" data-act="mode" data-arg="balloon">🎈 ふうせんわりで あつめる</button>`;
    } else if (v.fed) {
      bubble = 'おいしい!';
      body = left
        ? `<button class="pill chunky" data-act="petNext">もっと あげる(あと ${left}かい)</button>`
        : `<p class="pet-msg">おなか いっぱい!また あした ごはんを あげてね</p>`;
    } else if (left) {
      bubble = 'おなか すいた〜';
      body = `<button class="listen chunky" data-act="petSay"><span class="l-ico" aria-hidden="true">🔊</span>なにが たべたい?</button>
        <div class="opts n${v.options.length}">${v.options.map((w, k) =>
          `<button class="opt chunky" data-act="feed" data-arg="${k}" aria-label="${w.ja}">${pic(w)}</button>`).join('')}</div>
        ${hintRow(v)}`;
    } else {
      bubble = 'げんき いっぱい!';
      body = `<p class="pet-msg">きょうの ごはんは おしまい。また あした あげてね</p>`;
    }
    return `<div class="pet">
      <div class="pet-stage chunky" ${sceneAttrs(state.wear.bg)}>
        <p class="bubble ja">${bubble}</p>
        <button class="pet-body ${v.happy ? 'happy' : ''}" data-act="petTap" aria-label="${P.ja}">${figure()}</button>
        <p class="pet-name"><span>${P.ja}</span><span class="hearts" aria-label="なかよし ${state.pet.hearts}">❤️ ${state.pet.hearts}</span></p>
      </div>
      <button class="pill alt chunky" data-act="closet">👕 きせかえ(🪙${state.coins})</button>
      ${st > 0 && v.want ? caption(lineWant(v.want), state.capHide && !v.fed) : ''}
      ${body}
      <ol class="growth" aria-label="そだちかた">${PET_STAGES.map((p, k) =>
        `<li class="${k <= st ? 'got' : ''} ${k === st ? 'now' : ''}"><span class="g-e">${k <= st ? figure({}, k) : '?'}</span><span class="g-at">⭐${p.at}</span></li>`).join('')}</ol>
    </div>`;
  },

  closet() {
    const v = view, sel = v.sel && ITEM[v.sel];
    const wear = sel ? { ...state.wear, [sel.slot]: sel.id } : state.wear;
    let bar;
    if (!sel) bar = `<p class="hint">タップすると ためしに きてみられるよ</p>`;
    else {
      const owned = state.owned[sel.id], worn = state.wear[sel.slot] === sel.id, short = sel.price - state.coins;
      const btn = !owned
        ? (short > 0 ? `<button class="pill chunky" disabled>あと 🪙${short} たりない</button>`
                     : `<button class="pill chunky" data-act="buy">🪙${sel.price} で かう</button>`)
        : worn ? `<button class="pill alt chunky" data-act="unwear">はずす</button>`
               : `<button class="pill chunky" data-act="wear">${sel.slot === 'bg' ? 'ここに する' : 'つける'}</button>`;
      bar = `<button class="item-name" data-act="itemSay">${sel.en}<small>${sel.ja}</small></button>${btn}`;
    }
    return `<div class="closet">
      <div class="pet-stage chunky" ${sceneAttrs(wear.bg)}>
        <span class="pet-body">${figure(wear)}</span>
        <p class="pet-name"><span>${PET_STAGES[petStage()].ja}</span><span class="hearts">🪙 ${state.coins}</span></p>
      </div>
      <div class="tabs" role="tablist">${SLOTS.map(sl =>
        `<button class="tab" role="tab" aria-selected="${sl.id === v.slot}" data-act="slot" data-arg="${sl.id}">${sl.ja}</button>`).join('')}</div>
      <div class="item-bar">${bar}</div>
      <div class="items">${ITEMS.filter(it => it.slot === v.slot).map(it => {
        const owned = state.owned[it.id], worn = state.wear[it.slot] === it.id;
        return `<button class="item chunky ${owned ? 'owned' : ''} ${worn ? 'wearing' : ''} ${it.id === v.sel ? 'sel' : ''}" data-act="item" data-arg="${it.id}" aria-label="${it.ja}">
          <span class="i-e">${accIcon(it)}</span><span class="i-p">${worn ? 'つけてる' : owned ? '✓ もってる' : '🪙' + it.price}</span></button>`;
      }).join('')}</div>
    </div>`;
  },

  stickers() {
    const got = Math.min(Math.floor(state.stars / 5), STICKERS.length);
    return `<p class="stk-note">⭐ 5こで シールが 1まい もらえるよ。いま ${got} / ${STICKERS.length} まい</p>
      <div class="stickers">${STICKERS.map((s, k) => k < got
        ? `<span class="sticker chunky" role="img" aria-label="シール">${s}</span>`
        : `<span class="sticker locked" aria-label="まだ">?</span>`).join('')}</div>`;
  },

/* ---------- game logic ---------- */
function sayCard() {
  const c = CAT[view.cat], w = c.words[view.i];
  state.learned[c.id + ':' + w.en] = 1; save();
  Speech.say(w.en);
}
function sayQuestion() {
  const q = view.round[view.i];
  Speech.sayAll([CAT[view.cat].q(q.answer), q.answer.en]);
}
function startQuiz(catId) {
  const c = CAT[catId], n = state.level === 1 ? 3 : 4, len = state.level === 1 ? 5 : 8;
  const round = sample(c.words, Math.min(len, c.words.length)).map(answer => ({
    answer, options: shuffle([answer, ...sample(c.words.filter(w => w !== answer), n - 1)])
  }));
  go('quiz', { cat: catId, round, i: 0, earned: 0, firstTry: true, locked: false });
  sayQuestion();
}
function sayABC() {
  const L = ABC[view.sel];
  Speech.sayAll(['#' + L.l, abcLine(L)]);
}
function startSpell() {
  const max = state.level === 1 ? 4 : 5, seen = new Set();
  const pool = CATS.flatMap(c => c.words).filter(w => /^[a-z]+$/.test(w.en) && w.en.length >= 3 && w.en.length <= max && !seen.has(w.en) && seen.add(w.en));
  view = { name: 'spell', words: sample(pool, 5), i: 0, earned: 0 };
  setupSpellWord(); render(); window.scrollTo(0, 0);
  Speech.say(view.words[0].en);
}
function setupSpellWord() {
  const ans = view.words[view.i].en, letters = [...ans];
  if (state.level > 1) {
    const extra = [...'abcdefghijklmnoprstuwy'].filter(ch => !ans.includes(ch));
    letters.push(rnd(extra));
  }
  let s = shuffle(letters), tries = 0;
  while (s.join('').startsWith(ans) && tries++ < 10) s = shuffle(letters);
  Object.assign(view, { tiles: s.map(ch => ({ ch, used: false })), filled: [], done: false, firstTry: true, shake: false, checking: false, hintLv: 0, hintText: '' });
}
/* ふうせんわり */
function startBalloon() {
  const total = state.level === 1 ? 6 : 10;
  view = { name: 'balloon', total, i: 0, earned: 0, words: sample(BALLOON_WORDS, total), balloons: [] };
  render(); window.scrollTo(0, 0);
  spawnWave();
  balloonLoop(view);
}
function spawnWave() {
  const v = view, field = $('.field'), target = v.words[v.i], n = state.level === 1 ? 3 : 4;
  const items = shuffle([target, ...sample(BALLOON_WORDS.filter(w => w.en !== target.en), n - 1)]);
  const colors = shuffle(['--tomato', '--sun', '--leaf', '--ocean', '--berry']);
  field.querySelectorAll('.balloon').forEach(b => b.remove());
  const W = field.clientWidth, H = field.clientHeight, lane = W / n;
  v.balloons = items.map((w, k) => {
    const el = document.createElement('button');
    el.className = 'balloon'; el.dataset.act = 'popB'; el.dataset.arg = k;
    el.style.setProperty('--bc', `var(${colors[k % colors.length]})`);
    el.setAttribute('aria-label', w.ja);
    el.innerHTML = `<span class="emoji">${w.e}</span>`;
    field.appendChild(el);
    const bw = el.offsetWidth, room = Math.max(0, lane - bw);
    return { w, el, alive: true, x: lane * k + room / 2 + (Math.random() - .5) * room * .7,
      y: H * (.72 + Math.random() * .3), sway: Math.random() * Math.PI * 2 };
  });
  v.speed = H / (state.level === 1 ? 10 : 6.5); // 1びょうに すすむ px
  v.firstTry = true; v.locked = false; v.hintLv = 0; v.hintText = '';
  const hr = $('.hintrow'); if (hr) hr.outerHTML = hintRow(v);
  setCaption(linePop(target), state.capHide);
  Speech.say(popLine(target));
}
function balloonLoop(v) {
  let last = performance.now();
  const step = now => {
    if (view !== v) return;
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    let escaped = false;
    v.balloons.forEach(b => {
      if (!b.alive) return;
      b.y -= v.speed * dt; b.sway += dt * 2;
      b.el.style.transform = `translate(${b.x + Math.sin(b.sway) * 8}px, ${b.y}px)`;
      if (b.y < -b.el.offsetHeight - 40) { b.alive = false; b.el.remove(); if (b.w === v.words[v.i]) escaped = true; }
    });
    if (escaped && !v.locked) {
      v.locked = true; sfx.bad(); Speech.say('Oops! Try again!');
      setTimeout(() => { if (view === v) { spawnWave(); v.firstTry = false; } }, 1600);
    }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* もぐらたたき */
function startMole() {
  const total = state.level === 1 ? 6 : 8;
  view = { name: 'mole', total, i: 0, earned: 0, words: sample(ABC, total), holes: Array(9).fill(null) };
  render(); window.scrollTo(0, 0);
  moleTarget(); moleTick(view);
}
function moleTarget() {
  Object.assign(view, { firstTry: true, locked: false, since: 0, hintLv: 0, hintText: '', glow: false });
  $$('.mole.glow').forEach(m => m.classList.remove('glow'));
  const hr = $('.hintrow'); if (hr) hr.outerHTML = hintRow(view);
  setCaption(lineLetter(view.words[view.i]), state.capHide);
  Speech.say('#' + view.words[view.i].l);
}
function moleTick(v) {
  if (view !== v) return;
  const easy = state.level === 1, target = v.words[v.i];
  const free = [...Array(9).keys()].filter(k => !v.holes[k]);
  if (free.length && !v.locked) {
    const k = rnd(free), btn = $$('.mole')[k];
    let L;
    if (!v.holes.some(h => h && h.L === target) && (v.since >= 2 || Math.random() < .4)) { L = target; v.since = 0; }
    else {
      const conf = !easy && CONFUSE[target.l] && Math.random() < .5 ? [...CONFUSE[target.l]] : null;
      L = conf ? ABC.find(x => x.l === rnd(conf)) : rnd(ABC.filter(x => x !== target));
      v.since++;
    }
    btn.querySelector('.m-card').textContent = easy ? L.u : L.l;
    btn.querySelector('.m-face').textContent = '🐹';
    btn.classList.add('up'); btn.classList.toggle('glow', !!v.glow && L === target);
    const h = { L }; v.holes[k] = h;
    h.timer = setTimeout(() => { if (view === v && v.holes[k] === h) { btn.classList.remove('up'); v.holes[k] = null; } }, easy ? 2800 : 1900);
  }
  setTimeout(() => moleTick(v), easy ? 1300 : 950);
}

function setShelf() {

/* おしゃべり(こどもが いう) */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
const speakMode = () => state.mic === 'auto' && SR ? 'auto' : state.mic !== 'off' && canRecord ? 'record' : 'repeat';
function startSpeak() {
  const max = state.level === 1 ? 6 : 10, seen = new Set();
  const pool = ['animals', 'food', 'colors', 'vehicles', 'body'].flatMap(id => CAT[id].words)
    .filter(w => w.en.length <= max && !seen.has(w.en) && seen.add(w.en));
  view = { name: 'speak', total: 5, i: 0, earned: 0, words: sample(pool, 5), mode: speakMode() };
  setupSay(); render(); window.scrollTo(0, 0);
  Speech.say(view.words[0].en);
}
function setupSay() { Object.assign(view, { phase: 'ready', tries: 0, heard: '', buf: null, note: '', hintLv: 0, hintText: '' }); }
function spSuccess(v) {
  v.phase = 'ok'; v.earned++; addStars(1); sfx.good(); render(); burst($('.say-card'));
  Speech.say(rnd(PRAISE));
}
// こどもの はつおんは みとめにくいので、にている ことばや ききまちがいやすい ことばも OK にする
const HOMO = { eye: ['i', 'aye', 'hi'], two: ['to', 'too'], four: ['for'], eight: ['ate'], one: ['won', 'want'], ear: ['here', 'year', 'hear'],
  red: ['read'], blue: ['blew'], nose: ['knows', 'no'], bear: ['bare', 'bar'], pig: ['big'], car: ['card'], bus: ['boss'], hand: ['and'],
  rice: ['ice', 'price', 'rise'], ship: ['sheep', 'chip'], cat: ['cut', 'kat'], dog: ['dug', 'doug'], egg: ['ag'], milk: ['mill'] };
const norm = t => t.toLowerCase().replace(/[^a-z ]/g, '').trim();
function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
  }
  return d[b.length];
}
function heardOk(alts, target) {
  const t = norm(target), ok = [t, ...(HOMO[t] || [])];
  return alts.some(a => {
    const s = norm(a);
    if (ok.some(o => (' ' + s + ' ').includes(' ' + o + ' '))) return true;
    return [s, ...s.split(' ')].some(wd => wd && 1 - lev(wd, t) / Math.max(wd.length, t.length) >= .6);
  });
}
function listenSpeech(v) {
  const sr = new SR(), wi = v.i; let got = false;
  const stale = () => view !== v || v.i !== wi;
  sr.lang = 'en-US'; sr.interimResults = false; sr.maxAlternatives = 5; v.sr = sr;
  sr.onresult = e => {
    got = true; if (stale()) return;
    const alts = [...e.results[0]].map(a => a.transcript);
    v.heard = alts[0] || '';
    if (heardOk(alts, v.words[v.i].en)) spSuccess(v);
    else { v.tries++; v.phase = 'check'; render(); Speech.say(v.words[v.i].en); }
  };
  sr.onerror = e => {
    if (stale() || !/not-allowed|service-not-allowed|audio-capture|network/.test(e.error)) return;
    got = true; v.mode = canRecord ? 'record' : 'repeat'; v.phase = 'ready';
    v.note = 'じどう はんていが つかえないので、きりかえたよ'; render();
  };
  sr.onend = () => { if (!stale() && !got && v.phase === 'rec') { v.tries++; v.heard = ''; v.phase = 'check'; render(); } };
  try { sr.start(); v.phase = 'rec'; render(); } catch (e) { v.mode = 'repeat'; v.phase = 'ready'; render(); }
}
async function recordVoice(v) {
  const wi = v.i, stale = () => view !== v || v.i !== wi;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { if (!stale()) { v.mode = 'repeat'; v.note = 'マイクが つかえないので、まねして いってみてね'; v.phase = 'ready'; render(); } return; }
  if (stale()) { stream.getTracks().forEach(t => t.stop()); return; }
  const mr = new MediaRecorder(stream), chunks = []; v.mr = mr;
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  mr.onstop = async () => {
    stream.getTracks().forEach(t => t.stop()); clearTimeout(v.recTimer);
    if (stale()) return;
    let buf = null;
    try {
      const ab = await new Blob(chunks, { type: mr.mimeType }).arrayBuffer();
      buf = await new Promise((res, rej) => sfx.ctx().decodeAudioData(ab, res, rej));
    } catch (e) {}
    if (stale() || v.phase === 'ok') return;
    v.buf = buf; v.phase = 'check';
    render(); playMineThenModel(v);
  };
  mr.start(); v.phase = 'rec'; render();
  v.recTimer = setTimeout(() => { if (mr.state === 'recording') mr.stop(); }, 4000);
}
async function playMineThenModel(v) {
  if (!v.buf) { Speech.say(v.words[v.i].en); return; }
  const id = ++Speech.seq; Speech.stop();
  await Speech.playBuf(v.buf);
  if (id === Speech.seq && view === v) Speech.one(v.words[v.i].en);
}

function finish(mode) {
  const v = view, total = mode === 'quiz' ? v.round.length : v.words.length;
  let earned = v.earned;
  if (earned === 0) { addStars(1); earned = 1; } // がんばった ほし
  const coins = v.earned * 2 + 5 + (v.earned === total ? 5 : 0); // せいかい 1つ 2まい + クリア 5 + ぜんぶ せいかい 5
  state.coins += coins; save();
  go('result', { earned, coins, perfect: v.earned === total, replay: { mode, cat: v.cat } });
  sfx.fanfare();
  Speech.say(view.perfect ? 'Perfect! Great job!' : 'Good job!');
}

const ACTS = {
  home: () => go('home'),
  go: arg => go(arg),
  mode(arg) {
    if (arg === 'cards' || arg === 'quiz') go('pick', { next: arg });
    else if (arg === 'abc') { go('abc', { sel: 0 }); sayABC(); }
    else if (arg === 'spell') startSpell();
    else if (arg === 'balloon') startBalloon();
    else if (arg === 'mole') startMole();
    else if (arg === 'memory') startMemory();
    else if (arg === 'shopgame') startShop();
    else if (arg === 'speak') startSpeak();
    else go(arg);
  },
  cat(arg) {
    if (view.next === 'cards') { go('cards', { cat: arg, i: 0 }); sayCard(); }
    else startQuiz(arg);
  },
  say: () => sayCard(),
  step(arg) {
    const len = CAT[view.cat].words.length;
    view.i = (view.i + Number(arg) + len) % len; render(); sayCard();
  },
  quizFromCards: () => startQuiz(view.cat),
  qsay: () => sayQuestion(),
  pick(arg, btn) {
    const v = view; if (v.locked) return;
    const q = v.round[v.i], w = q.options[Number(arg)];
    if (w === q.answer) {
      v.locked = true; btn.classList.add('correct'); sfx.good(); burst(btn); setCaption(lineQ(CAT[v.cat], q.answer), false);
      if (v.firstTry) { v.earned++; addStars(1); }
      Speech.sayAll([w.en, rnd(PRAISE)]);
      setTimeout(() => {
        if (view !== v) return;
        v.i++; v.firstTry = true; v.locked = false; v.hintLv = 0; v.hintText = '';
        if (v.i >= v.round.length) finish('quiz'); else { render(); sayQuestion(); }
      }, 1700);
    } else {
      btn.classList.add('wrong'); btn.disabled = true; v.firstTry = false; sfx.bad(); nudgeHint();
      Speech.sayAll(['Try again!', CAT[v.cat].q(q.answer)]);
    }
  },
  again() {
    const r = view.replay;
    ({ quiz: () => startQuiz(r.cat), balloon: startBalloon, spell: startSpell, mole: startMole, memory: startMemory, shopgame: startShop, speak: startSpeak })[r.mode]();
  },
  spModel: () => Speech.say(view.words[view.i].en),
  spMine: () => playMineThenModel(view),
  spMic() {
    const v = view; Speech.stop();
    if (v.mode === 'repeat') { v.phase = 'check'; render(); return; }
    if (v.phase === 'rec') { if (v.mode === 'auto') v.sr && v.sr.stop(); else if (v.mr && v.mr.state === 'recording') v.mr.stop(); return; }
    v.mode === 'auto' ? listenSpeech(v) : recordVoice(v);
  },
  spOk() { const v = view; if (v.phase === 'check') spSuccess(v); },
  spRetry() { const v = view; v.phase = 'ready'; render(); Speech.say(v.words[v.i].en); },
  spNext() {
    const v = view; v.i++;
    if (v.i >= v.total) finish('speak');
    else { const mode = v.mode; setupSay(); v.mode = mode; render(); Speech.say(v.words[v.i].en); }
  },
  hint() {
    const v = view, lv = v.hintLv = (v.hintLv || 0) + 1;
    const glow = el => el && el.classList.add('glow');
    if (v.name === 'quiz') {
      const q = v.round[v.i];
      if (lv === 1) { v.hintText = `にほんごで「${q.answer.ja}」`; Speech.sayAll([CAT[v.cat].q(q.answer), q.answer.en], true); }
      else { v.firstTry = false; v.hintText = 'ひかっている のが こたえだよ'; glow($$('.opt')[q.options.indexOf(q.answer)]); Speech.say(q.answer.en, true); }
    } else if (v.name === 'balloon') {
      const t = v.words[v.i];
      if (lv === 1) { v.hintText = `「${t.ja}」の ふうせんを わろう`; v.speed *= .6; Speech.say(popLine(t), true); }
      else { v.firstTry = false; v.hintText = 'ひかっている ふうせんだよ'; v.balloons.filter(b => b.alive && b.w === t).forEach(b => glow(b.el)); Speech.say(t.en, true); }
    } else if (v.name === 'mole') {
      const L = v.words[v.i];
      if (lv === 1) { v.hintText = `「${L.u}」の もぐらを たたこう`; Speech.say('#' + L.l, true); }
      else { v.firstTry = false; v.glow = true; v.hintText = 'ひかっている もぐらだよ'; v.holes.forEach((h, k) => { if (h && h.L === L) glow($$('.mole')[k]); }); }
    } else if (v.name === 'memory') {
      v.misses++; v.busy = true; v.hintText = lv >= 2 ? 'ちらっと みるのは おしまい' : 'あと 1かい みられるよ';
      const els = $$('.mcard'); els.forEach(el => el.classList.add('up'));
      setTimeout(() => { if (view !== v) return; els.forEach((el, k) => { if (!v.cards[k].up) el.classList.remove('up'); }); v.busy = false; }, 1500);
    } else if (v.name === 'shopgame') {
      const o = v.words[v.i];
      if (lv === 1) { v.hintText = `「${o.w.ja}」を ${o.n}こ ほしいんだって`; Speech.say(orderLine(o.n, o.w), true); }
      else { v.firstTry = false; v.hintText = `${o.w.e} × ${o.n}`; }
    } else if (v.name === 'spell') {
      const ans = v.words[v.i].en;
      if (lv === 1) { v.hintText = 'ゆっくり きいてみよう'; Speech.sayAll([ans, ...[...ans].map(ch => '#' + ch)], true); }
      else { v.firstTry = false; v.hintText = 'ひかっている もじを えらんでね'; }
    } else if (v.name === 'pet') {
      if (lv === 1) { v.hintText = `「${v.want.ja}」が たべたいみたい`; Speech.say(wantLine(v.want), true); }
      else { v.firstTry = false; v.hintText = 'ひかっている ものだよ'; glow($$('.opt')[v.options.indexOf(v.want)]); }
    } else if (v.name === 'speak') {
      v.hintText = 'ゆっくり きいて、まねしてみよう'; Speech.say(v.words[v.i].en, true);
    }
    if (v.name === 'spell') render();
    else { const hr = $('.hintrow'); if (hr) hr.outerHTML = hintRow(v); }
  },
  msay: () => Speech.say('#' + view.words[view.i].l),
  whack(arg, btn) {
    const v = view, k = Number(arg), h = v.holes[k];
    if (!h || h.hit || v.locked) return;
    const target = v.words[v.i];
    if (h.L === target) {
      h.hit = true; v.locked = true; clearTimeout(h.timer);
      btn.querySelector('.m-face').textContent = '😵'; setCaption(lineLetter(target), false);
      sfx.pop(); burst(btn);
      if (v.firstTry) { v.earned++; addStars(1); }
      Speech.sayAll(['#' + target.l, rnd(PRAISE)]);
      setTimeout(() => {
        if (view !== v) return;
        btn.classList.remove('up'); v.holes[k] = null; v.i++;
        if (v.i >= v.total) { finish('mole'); return; }
        $('.progress').outerHTML = progress(v.total, v.i);
        const sign = $('.sign'); if (sign) sign.textContent = v.words[v.i].u;
        moleTarget();
      }, 1200);
    } else {
      btn.classList.remove('miss'); void btn.offsetWidth; btn.classList.add('miss');
      v.firstTry = false; sfx.bad(); nudgeHint(); Speech.say('#' + target.l);
    }
  },
  flip(arg) {
    const v = view, k = Number(arg), c = v.cards[k];
    if (v.busy || c.up) return;
    c.up = true; $$('.mcard')[k].classList.add('up'); v.open.push(k);
    v.last = c.w; const mc = $('.mcap'); if (mc) mc.innerHTML = caption(lineWord(c.w), false);
    Speech.say(c.w.en);
    if (v.open.length < 2) return;
    const [a, b] = v.open.map(i => v.cards[i]), els = v.open.map(i => $$('.mcard')[i]);
    v.open = [];
    if (a.k === b.k) {
      v.matched++;
      setTimeout(() => {
        if (view !== v) return;
        els.forEach(el => el.classList.add('done')); sfx.good(); burst(els[1]);
        $('.mcount').textContent = `みつけた ${v.matched} / ${v.total}`;
        Speech.sayAll([a.w.en, rnd(PRAISE)]);
        if (v.matched === v.total) setTimeout(() => {
          if (view !== v) return;
          v.earned = Math.max(1, v.total - Math.floor(v.misses / 2)); // 2かい まちがえるごとに ⭐ -1
          addStars(v.earned); finish('memory');
        }, 1800);
      }, 450);
    } else {
      v.misses++; v.busy = true;
      setTimeout(() => {
        if (view !== v) return;
        a.up = b.up = false; els.forEach(el => el.classList.remove('up')); v.busy = false;
      }, 1300);
    }
  },
  osay: () => sayOrder(),
  tobasket(arg) {
    const v = view; if (v.done || v.basket.length >= 6) return;
    const w = v.shelf[Number(arg)]; v.basket.push(w); render();
    const n = v.basket.filter(x => x === w).length; // おなじ ものの かずを かぞえる
    Speech.say(CAT.numbers.words[n - 1].en);
  },
  unbasket(arg) { const v = view; if (v.done) return; v.basket.splice(Number(arg), 1); render(); },
  handover() {
    const v = view, o = v.words[v.i];
    if (v.done || !v.basket.length) return;
    if (v.basket.length === o.n && v.basket.every(w => w === o.w)) {
      v.done = true; sfx.good();
      if (v.firstTry) { v.earned++; addStars(1); }
      render(); burst($('.who'));
      Speech.sayAll(['Here you are!', 'Thank you!']);
    } else {
      v.firstTry = false; sfx.bad(); render(); nudgeHint();
      Speech.sayAll(['Try again!', orderLine(o.n, o.w)]);
    }
  },
  onext() {
    const v = view; v.i++;
    if (v.i >= v.total) finish('shopgame');
    else { setShelf(); render(); sayOrder(); }
  },
  bsay: () => Speech.say(popLine(view.words[view.i])),
  popB(arg, el) {
    const v = view, b = v.balloons[Number(arg)];
    if (v.locked || !b || !b.alive) return;
    const target = v.words[v.i];
    if (b.w === target) {
      v.locked = true; b.alive = false;
      el.classList.add('popped'); el.innerHTML = '<span class="emoji">💥</span>'; setCaption(linePop(target), false);
      sfx.pop(); burst(el);
      if (v.firstTry) { v.earned++; addStars(1); }
      Speech.sayAll([target.en, rnd(PRAISE)]);
      setTimeout(() => {
        if (view !== v) return;
        v.i++;
        if (v.i >= v.total) { finish('balloon'); return; }
        $('.progress').outerHTML = progress(v.total, v.i);
        spawnWave();
      }, 1400);
    } else {
      el.classList.remove('wobble'); void el.offsetWidth; el.classList.add('wobble');
      v.firstTry = false; sfx.bad(); nudgeHint(); Speech.say(popLine(target));
    }
  },
  pet: () => openPet(),
  closet: () => go('closet', { slot: 'head', sel: null }),
  slot(arg) { view.slot = arg; view.sel = null; render(); },
  item(arg) { view.sel = arg; render(); Speech.say(ITEM[arg].en); },
  itemSay: () => Speech.say(ITEM[view.sel].en),
  buy() {
    const it = ITEM[view.sel];
    if (state.owned[it.id] || state.coins < it.price) return;
    state.coins -= it.price; state.owned[it.id] = 1; state.wear[it.slot] = it.id; save();
    sfx.fanfare(); render(); burst($('.closet .figure'));
    Speech.sayAll(['Thank you!', 'You look great!']);
  },
  wear() { const it = ITEM[view.sel]; state.wear[it.slot] = it.id; save(); render(); sfx.good(); Speech.say('You look great!'); },
  unwear() { const it = ITEM[view.sel]; state.wear[it.slot] = null; save(); view.sel = null; render(); },
  petSay: () => Speech.say(wantLine(view.want)),
  petNext() { setupMeal(); render(); Speech.say(wantLine(view.want)); },
  petTap(arg, el) {
    el.classList.remove('happy', 'wobble'); void el.offsetWidth;
    if (petStage() === 0) { el.classList.add('wobble'); return; }
    el.classList.add('happy'); Speech.say(rnd(['Hello!', 'I love you!']));
  },
  feed(arg, btn) {
    const v = view, w = v.options[Number(arg)];
    if (v.fed) return;
    if (w === v.want) {
      if (state.pet.day !== today()) { state.pet.day = today(); state.pet.meals = 0; }
      state.pet.meals++; state.pet.hearts++; state.coins += 3; save();
      v.fed = true; v.happy = true; sfx.good();
      if (v.firstTry) addStars(1);
      render(); burst($('.pet-body'));
      Speech.sayAll(mealsLeft() ? ['Yummy! Thank you!'] : ['Yummy! Thank you!', "I'm full! See you tomorrow!"]);
    } else {
      btn.classList.add('wrong'); btn.disabled = true; v.firstTry = false; sfx.bad(); nudgeHint();
      Speech.sayAll(['No, thank you.', wantLine(v.want)]);
    }
  },
  abc(arg) { view.sel = Number(arg); render(); sayABC(); },
  abcsay: () => sayABC(),
  ssay: () => Speech.say(view.words[view.i].en),
  tile(arg) {
    const v = view; if (v.done || v.checking) return;
    const t = v.tiles[Number(arg)]; if (t.used) return;
    t.used = true; v.filled.push(Number(arg));
    const ans = v.words[v.i].en;
    if (v.filled.length < ans.length) { render(); Speech.say('#' + t.ch); return; }
    if (v.filled.map(k => v.tiles[k].ch).join('') === ans) {
      v.done = true; sfx.good();
      if (v.firstTry) { v.earned++; addStars(1); }
      render(); burst($('.slots'));
      Speech.sayAll([...[...ans].map(ch => '#' + ch), ans, rnd(PRAISE)]);
    } else {
      v.firstTry = false; v.shake = true; v.checking = true; sfx.bad(); render();
      setTimeout(() => {
        if (view !== v) return;
        let m = 0; while (v.tiles[v.filled[m]].ch === ans[m]) m++;
        v.filled.slice(m).forEach(k => { v.tiles[k].used = false; });
        v.filled = v.filled.slice(0, m); v.shake = false; v.checking = false;
        render(); nudgeHint(); Speech.say(ans);
      }, 700);
    }
  },
  unslot(arg) {
    const v = view; if (v.done || v.checking) return;
    const j = Number(arg);
    v.filled.slice(j).forEach(k => { v.tiles[k].used = false; });
    v.filled = v.filled.slice(0, j); render();
  },
  sback() { const v = view; if (v.done || v.checking || !v.filled.length) return; v.tiles[v.filled.pop()].used = false; render(); },
  snext() {
    const v = view; v.i++;
    if (v.i >= v.words.length) finish('spell');
    else { setupSpellWord(); render(); Speech.say(v.words[v.i].en); }
  },
  level(arg) { state.level = Number(arg); save(); render(); },
  rate(arg) { state.rate = Number(arg); save(); render(); Speech.say('Hello! Let’s play!'); },
  mic(arg) { state.mic = arg; save(); render(); },
  caption(arg) { state.caption = arg; save(); render(); },
  capHide(arg) { state.capHide = arg === '1'; save(); render(); },
  ja(arg) { state.showJa = arg === '1'; save(); render(); },
  resetAsk() { view.confirmReset = true; render(); },
  resetNo() { view.confirmReset = false; render(); },
  resetYes() { Object.assign(state, { stars: 0, learned: {}, coins: 10, owned: {}, wear: { head: null, face: null, hand: null, bg: null }, pet: { day: '', meals: 0, hearts: 0 } }); save(); view.confirmReset = false; render(); toast('きろくを けしました'); }
};

// うごく まと(ふうせん・もぐら)は 指が ふれた しゅんかんに はんのう する
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.balloon, .mole'); if (!b) return;
  e.preventDefault(); sfx.ctx(); ACTS[b.dataset.act](b.dataset.arg, b);
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if ((b.dataset.act === 'popB' || b.dataset.act === 'whack') && e.detail > 0) return; // pointerdown で処理ずみ
  sfx.ctx();
  const fn = ACTS[b.dataset.act]; if (fn) fn(b.dataset.arg, b);
});
document.addEventListener('keydown', e => {
  if (view.name !== 'cards') return;
  if (e.key === 'ArrowRight') ACTS.step(1);
  if (e.key === 'ArrowLeft') ACTS.step(-1);
});

render();
</script>
